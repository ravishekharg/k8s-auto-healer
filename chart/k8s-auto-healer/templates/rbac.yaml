# Leader election: a Lease in the healer's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "healer.name" . }}-leader
  labels: {{- include "healer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "healer.name" . }}-leader
  labels: {{- include "healer.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "healer.name" . }}-leader }
subjects:
  - { kind: ServiceAccount, name: {{ include "healer.name" . }}, namespace: {{ .Release.Namespace }} }
{{- if .Values.watchNamespaces }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "healer.name" $ }}
  namespace: {{ . }}
  labels: {{- include "healer.labels" $ | nindent 4 }}
rules:
{{ include "healer.podRules" $ | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "healer.name" $ }}
  namespace: {{ . }}
  labels: {{- include "healer.labels" $ | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "healer.name" $ }} }
subjects:
  - { kind: ServiceAccount, name: {{ include "healer.name" $ }}, namespace: {{ $.Release.Namespace }} }
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "healer.name" . }}
  labels: {{- include "healer.labels" . | nindent 4 }}
rules:
{{ include "healer.podRules" . | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "healer.name" . }}
  labels: {{- include "healer.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "healer.name" . }} }
subjects:
  - { kind: ServiceAccount, name: {{ include "healer.name" . }}, namespace: {{ .Release.Namespace }} }
{{- end }}
{{- if .Values.nodeRemediation.enabled }}
---
# Node remediation: cordon/uncordon nodes, and drain them, which means evicting pods in any
# namespace (a node runs pods from all of them).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "healer.name" . }}-nodes
  labels: {{- include "healer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "healer.name" . }}-nodes
  labels: {{- include "healer.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "healer.name" . }}-nodes }
subjects:
  - { kind: ServiceAccount, name: {{ include "healer.name" . }}, namespace: {{ .Release.Namespace }} }
{{- end }}
