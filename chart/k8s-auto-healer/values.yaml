image:
  repository: ghcr.io/ravishekharg/k8s-auto-healer
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Two replicas with leader election: one acts, the other takes over within leaseSeconds.
replicaCount: 2

# Namespaces to watch. Empty = all namespaces (ClusterRole); a list = Roles only in those
# namespaces, which is the least-privilege option for a shared cluster.
watchNamespaces: []

dryRun: false                 # start with true in a new cluster: log and record events only
intervalSeconds: 10
failureThreshold: 3           # consecutive failed functional checks before acting
cooldownSeconds: 120          # per workload, after a replacement pod has come up
maxActionsPerHour: 10         # cluster-wide brake: a systemic outage must page a human
startupGraceSeconds: 60       # don't judge pods that are still starting
stuckTerminatingSeconds: 600
crashloopMinRestarts: 5
notifyWebhookUrl: ""          # Slack-compatible incoming webhook (optional)
podMaxFailingFraction: 0.5    # circuit breaker: more than this share of checked pods failing at once = shared cause, stop evicting

# Node remediation: cordon + drain nodes NotReady or under Memory/Disk/PID pressure past a
# threshold, uncordon them after they recover. Needs cluster-wide RBAC on nodes and pods
# (granted only when enabled), whatever watchNamespaces says.
nodeRemediation:
  enabled: false
  notReadySeconds: 120
  pressureSeconds: 120
  recoverySeconds: 120          # healthy this long before an uncordon
  maxUnhealthyFraction: 0.34    # circuit breaker: more unhealthy workers than this = shared cause, do nothing
  maxActionsPerHour: 2
  drain: true                   # false = cordon only

# With node remediation on, keep the healer off the nodes it may drain (e.g. a system node
# group, or the control plane where that's allowed): a healer on a dead node can't heal it.
nodeSelector: {}
tolerations: []

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { memory: 192Mi }
